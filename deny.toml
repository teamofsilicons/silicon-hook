[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 (Marvin): timing side channel in RSA private-key
  # operations. Hook only verifies provider signatures with public keys and
  # never loads, stores, or uses an RSA private key, so the affected code path
  # is unreachable. No fixed release of `rsa` exists; revisit when one ships.
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private-key operations" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "LicenseRef-Silicon-IAM",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

# The official Silicon IAM SDK is published by Team of Silicons under its own
# license file rather than an SPDX expression. It is first-party to this
# platform, so it is named explicitly instead of being allowed by classifier.
[[licenses.clarify]]
crate = "silicon-iam"
expression = "LicenseRef-Silicon-IAM"
license-files = [{ path = "LICENSE", hash = 0xa12835ec }]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
