[package]
name = "silicon-hook"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
default-run = "hook-api"

[lib]
name = "silicon_hook"
path = "src/lib.rs"

[[bin]]
name = "hook-api"
path = "src/bin/hook_api.rs"

[[bin]]
name = "hook-worker"
path = "src/bin/hook_worker.rs"

[[bin]]
name = "hook-migrate"
path = "src/bin/hook_migrate.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "matched-path", "ws"] }
base64 = "0.22.1"
bytes = "1.11.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem"] }
form_urlencoded = "1.2.2"
futures = "0.3.31"
getrandom = "0.3.4"
garde = { version = "0.23.0", features = ["derive", "regex", "url"] }
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
httpdate = "1.0.3"
jiff = { version = "0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
multer = "3.1.0"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pem", "std"] }
percent-encoding = "2.3.2"
regex = "1.12.2"
rsa = { version = "0.9.10", features = ["sha1", "sha2"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "http2", "json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.7"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["buffer", "limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.26.0", features = ["serde", "v4", "v7"] }
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1.8.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio-tungstenite = "0.29.0"
wiremock = "0.6.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
