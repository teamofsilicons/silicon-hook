[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 (Marvin): timing side channel in RSA private-key
  # operations. Hook only verifies provider signatures with public keys and
  # never loads, stores, or uses an RSA private key, so the affected code path
  # is unreachable. No fixed release of `rsa` exists; revisit when one ships.
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private-key operations" },
  # The Accounts SDK still pulls crypto-bigint 0.5 through jsonwebtoken 11.
  # Hook verifies Accounts tokens with EdDSA. Its P-256 provider path only
  # parses public keys and verifies public signatures. Revisit when the SDK
  # supports jsonwebtoken 12, or before adding any private EC operations.
  { id = "RUSTSEC-2026-0387", reason = "the affected EC arithmetic handles only public verification inputs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
