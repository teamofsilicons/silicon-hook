[package]
name = "silicon-hook-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
description = "The hook CLI: manage a Silicon's signed provider webhooks, signed in with Silicon Accounts"
license = "Apache-2.0"
readme = "../../docs/cli/README.md"
repository = "https://github.com/teamofsilicons/silicon-hook"
keywords = ["webhooks", "silicon", "hook", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "hook"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
silicon-hook-client = { path = "../client", version = "1.0.0" }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1.26.0", features = ["serde", "v7", "v4"] }
zeroize = "1.8.2"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["io-util", "net", "process"] }

[lints.rust]
unsafe_code = "forbid"
