  "/api/v2/silicons/{silicon_id}/deliveries/ack":
    description: "Every HTTP method on this former Hook delivery route returns 410 delivery_transport_replaced after request admission. Use Ting delivery and authorized event hydration. No WebSocket upgrade, polling queue or cumulative ACK is available in v2."
    parameters:
      -
        "$ref": "#/components/parameters/TestAppSecret"
      -
        "$ref": "#/components/parameters/TestKey"
      -
        "$ref": "#/components/parameters/SiliconId"
    post:
      tags:
        - "Ting"
      operationId: "acknowledgeRetiredDeliveriesV2"
      summary: "Reject the replaced Hook delivery transport"
      description: "This compatibility tombstone never returns a successful transport response. The documented method and every other method return 410; ordinary request and API contract admission checks still apply."
      security: []
      responses:
        "410":
          "$ref": "#/components/responses/DeliveryTransportReplaced"
  "/api/v2/silicons/{silicon_id}/deliveries/cursor":
    description: "Every HTTP method on this former Hook delivery route returns 410 delivery_transport_replaced after request admission. Use Ting delivery and authorized event hydration. No WebSocket upgrade, polling queue or cumulative ACK is available in v2."
    parameters:
      -
        "$ref": "#/components/parameters/TestAppSecret"
      -
        "$ref": "#/components/parameters/TestKey"
      -
        "$ref": "#/components/parameters/SiliconId"
    get:
      tags:
        - "Ting"
      operationId: "getRetiredDeliveryCursorV2"
      summary: "Reject the replaced Hook delivery transport"
      description: "This compatibility tombstone never returns a successful transport response. The documented method and every other method return 410; ordinary request and API contract admission checks still apply."
      security: []
      responses:
        "410":
          "$ref": "#/components/responses/DeliveryTransportReplaced"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: IAM opaque access token
  parameters:
    TestAppSecret:
      name: X-Hook-Test-App-Secret
      in: header
      required: false
      description: >-
        IAM test application selector, validated online on each request. Mutually
        exclusive with X-Hook-Test-Key. Never send on ingress or root administration
        routes. Invalid selectors fail closed; they never select production.
      schema:
        type: string
        pattern: '^ask_[A-Za-z0-9_-]{43}$'
    OrgId:
      name: X-Org-ID
      in: header
      required: true
      schema:
        "$ref": "#/components/schemas/OrganizationId"
    SiliconId:
      name: silicon_id
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/SiliconId"
    HookId:
      name: hook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EndpointKey:
      name: endpoint_key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9]{8}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: "^[!-~]+$"
    HistoryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 100
    HistoryCursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TestKey:
      name: X-Hook-Test-Key
      in: header
      required: false
      description: Selects an isolated Hook environment. The bearer must be from its
        linked IAM test world. Never attach to public ingress.
      schema:
        type: string
        pattern: "^[A-Za-z0-9]{32}$"
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: "event_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    SourceEnvironmentId:
      name: "environment_id"
      in: "query"
      description: "Original event environment UUID; production uses the nil UUID. Supply together with environment_generation. This is a reference check, not a credential or environment selector."
      schema:
        type: "string"
        format: "uuid"
    SourceEnvironmentGeneration:
      name: "environment_generation"
      in: "query"
      description: "Original event generation; production uses zero. Supply together with environment_id. Preserved across key rotation and restore; a clean deletes the canonical event."
      schema:
        type: "integer"
        format: "int64"
        minimum: 0
  responses:
    BadRequest:
      description: Required HTTP syntax, headers, or JSON are malformed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    HealthOk:
      description: Process or dependency is healthy.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Health"
    EventPageOk:
      description: Verified requests, newest first, at most 10,000 per page.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/EventPage"
    BlockedPageOk:
      description: Withheld requests, newest first, at most 10,000 per page.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/BlockedRequestPage"
    Unauthorized:
      description: Credential is absent, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: The authenticated actor lacks authority.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Blocked:
      description: The client address is blocked for this endpoint (code ip_blocked).
        The block carries Retry-After.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not visible.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: Idempotency or resource-state conflict.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Gone:
      description: A recovery or one-time-secret replay window expired, or the endpoint
        key was retired by rotation (code endpoint_retired).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    RequestTimeout:
      description: Request processing exceeded the service deadline.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    PayloadTooLarge:
      description: The body exceeds 1 MiB or the headers exceed 64 KiB.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The endpoint requires application/json.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    UnprocessableEntity:
      description: The request violates input rules; details may explain why.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    InternalError:
      description: An unexpected internal invariant or programming failure occurred.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required dependency cannot make a safe decision.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    ContractSunset:
      description: "The selected API contract has sunset (api_version_sunset)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    DeliveryTransportReplaced:
      description: "Hook delivery was replaced by Ting (delivery_transport_replaced). A sunset API contract can instead return api_version_sunset. No transport connection or delivery operation occurred."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    RateLimited:
      description: "The required upstream operation was rate limited. Retry after the supplied number of seconds."
      headers:
        Retry-After:
          schema:
            type: "integer"
            minimum: 1
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    TelemetryEvent:
      type: object
      additionalProperties: false
      required: [event_id, trace_id, source, step, outcome, version]
      properties:
        event_id: {type: string, format: uuid}
        trace_id: {type: string, format: uuid}
        source: {type: string, enum: [cli, daemon, client, web]}
        step: {type: string, enum: [command, connect, subscribe, deliver, ack, refresh, update, page_view, interaction, error]}
        outcome: {type: string, enum: [started, succeeded, failed, retrying, skipped]}
        version: {type: string, minLength: 1, maxLength: 32, pattern: '^[0-9.]+$'}
        operation:
          type: string
          enum: [login, logout, whoami, refresh, webhook, unhook, hooks, events, blocked, deliveries, env, config, daemon, docs, commands, system, report, about, overview, live, testing, connections, relay, iam, create, set-secret, list, show, update, delete, restore, enable, disable, rotate, connect-iam, listen]
        duration_ms: {type: integer, minimum: 0}
        progress: {type: integer, minimum: 0, maximum: 4294967295}
        status: {type: integer, minimum: 0, maximum: 65535}
        os: {type: string, enum: [linux, macos, windows, freebsd, openbsd, netbsd, android, ios, unknown]}
        arch: {type: string, enum: [x86_64, aarch64, x86, arm, riscv64, wasm32, unknown]}
    OrganizationId:
      type: string
      minLength: 1
      maxLength: 100
      pattern: "^[!-~]+$"
    SiliconId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[!-~]+$"
    ExternalId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[!-~]+$"
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
    VersionInfo:
      type: object
      additionalProperties: false
      required:
      - service
      - version
      properties:
        service:
          const: silicon-hook
        version:
          type: string
    ActorRef:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - carbon
          - silicon
          - application
          - service
        id:
          "$ref": "#/components/schemas/ExternalId"
    HookStatus:
      type: string
      description: Disabled is reversible and retained; deleted is the separate 45-day
        recovery lifecycle.
      enum:
      - active
      - disabled
      - deleted
    SignatureAlgorithm:
      type: string
      enum:
      - HMAC-SHA1
      - HMAC-SHA256
      - HMAC-SHA384
      - HMAC-SHA512
      - SHA1
      - SHA256
      - SHA384
      - SHA512
      - Ed25519
      - ECDSA-SHA256
      - RSA-SHA1
      - RSA-SHA256
    SignatureEncoding:
      type: string
      enum:
      - hex
      - base64
      - base64url
      - raw
    SecretEncoding:
      type: string
      enum:
      - utf8
      - ascii
      - hex
      - base64
      - base64url
      - raw
    SignatureExpression:
      type: string
      minLength: 1
      maxLength: 4096
      description: An expression over request blocks (`request.raw_body`, `request.headers["name"]`,
        `request.query.key`, `request.body.path`, `request.form.key`, `request.multipart.key`,
        `request.method`, `request.url`, ...), `hook.id`, `hook.url`, `secret`, and
        `key.public`, combined with concat, join, sort, sort_keys, utf8, ascii, url_encode,
        url_decode, percent_encode, percent_decode, canonicalize_url, canonicalize_query,
        json_encode, form_encode, sha1, sha256, sha384, sha512, hex, hex_decode, base64,
        base64_decode, base64url, base64url_decode, lowercase, uppercase, and trim.
    SignaturePolicy:
      type: object
      additionalProperties: false
      required:
      - required
      - algorithm
      - payload
      - signature
      - signature_encoding
      - secret_encoding
      - public_key
      - has_secret
      properties:
        required:
          type: boolean
        algorithm:
          "$ref": "#/components/schemas/SignatureAlgorithm"
        payload:
          "$ref": "#/components/schemas/SignatureExpression"
        signature:
          "$ref": "#/components/schemas/SignatureExpression"
        signature_encoding:
          "$ref": "#/components/schemas/SignatureEncoding"
        secret_encoding:
          "$ref": "#/components/schemas/SecretEncoding"
        public_key:
          type:
          - string
          - 'null'
          maxLength: 16384
        has_secret:
          type: boolean
    SignaturePolicyInput:
      type: object
      additionalProperties: false
      description: 'Every member is optional. Defaults are the Standard Webhooks convention:
        required, HMAC-SHA256, concat(request.headers["webhook-id"], ".", request.headers["webhook-timestamp"],
        ".", request.raw_body), request.headers["webhook-signature"], base64, utf8.
        BYOS secrets are stored verbatim on creation and replace the current secret on
        update. Omitting secret generates one on creation and keeps the current
        secret on update. Generated and rotated secrets respect secret_encoding.'
      properties:
        required:
          type: boolean
        algorithm:
          "$ref": "#/components/schemas/SignatureAlgorithm"
        payload:
          "$ref": "#/components/schemas/SignatureExpression"
        signature:
          "$ref": "#/components/schemas/SignatureExpression"
        signature_encoding:
          "$ref": "#/components/schemas/SignatureEncoding"
        secret_encoding:
          "$ref": "#/components/schemas/SecretEncoding"
        public_key:
          type:
          - string
          - 'null'
          maxLength: 16384
        secret:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: BYOS secret text (1-4096 UTF-8 bytes, no control characters).
            Set at creation or replace after registration. Must decode to nonempty
            key bytes with secret_encoding. Not accepted for asymmetric algorithms.
            Never echoed after the creation response.
    HookBase:
      type: object
      required:
      - id
      - org_id
      - silicon_id
      - name
      - endpoint_url
      - endpoint_key
      - status
      - signature
      - time_zone
      - created_by
      - created_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          "$ref": "#/components/schemas/OrganizationId"
        silicon_id:
          "$ref": "#/components/schemas/SiliconId"
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        endpoint_url:
          type: string
          format: uri
        endpoint_key:
          type: string
          pattern: "^[A-Z0-9]{8}$"
        status:
          "$ref": "#/components/schemas/HookStatus"
        signature:
          "$ref": "#/components/schemas/SignaturePolicy"
        time_zone:
          type: string
          maxLength: 64
          description: IANA zone used in delivery summaries.
        created_by:
          "$ref": "#/components/schemas/ActorRef"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type:
          - string
          - 'null'
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
        recoverable_until:
          type:
          - string
          - 'null'
          format: date-time
        last_received_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the provider last reached out with a verified request.
        last_blocked_at:
          type:
          - string
          - 'null'
          format: date-time
        endpoint_rotated_at:
          type:
          - string
          - 'null'
          format: date-time
    Hook:
      type: object
      allOf:
      - "$ref": "#/components/schemas/HookBase"
      unevaluatedProperties: false
    HookWithSecret:
      type: object
      allOf:
      - "$ref": "#/components/schemas/HookBase"
      required:
      - signing_secret
      properties:
        signing_secret:
          type:
          - string
          - 'null'
          description: Generated secrets are `v1.` followed by 32 alphanumeric characters;
            a supplied secret is echoed as given. Null for asymmetric algorithms.
      unevaluatedProperties: false
    HookCreate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        time_zone:
          type: string
          maxLength: 64
          default: UTC
        signature:
          "$ref": "#/components/schemas/SignaturePolicyInput"
    HookUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        time_zone:
          type: string
          maxLength: 64
        enabled:
          type: boolean
        signature:
          "$ref": "#/components/schemas/SignaturePolicyInput"
    HooksEnabledUpdate:
      type: object
      additionalProperties: false
      required:
      - hook_ids
      - enabled
      properties:
        hook_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            format: uuid
        enabled:
          type: boolean
    HookPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            "$ref": "#/components/schemas/Hook"
    SigningSecretResponse:
      type: object
      additionalProperties: false
      required:
      - signing_secret
      properties:
        signing_secret:
          type: string
          pattern: "^v1\\.[A-Za-z0-9]{32}$"
    CapturedRequest:
      type: object
      additionalProperties: false
      required:
      - method
      - url
      - path
      - query_string
      - headers
      - content_type
      - body
      - body_base64
      - remote_ip
      properties:
        method:
          type: string
        url:
          type: string
          format: uri
        path:
          type: string
        query_string:
          type: string
        headers:
          type: array
          description: Header fields in wire order with lowercase names.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
        content_type:
          type:
          - string
          - 'null'
        body:
          type:
          - string
          - 'null'
          description: Body text when it is UTF-8.
        body_base64:
          type:
          - string
          - 'null'
          description: Standard base64 of a non-UTF-8 body.
        remote_ip:
          type: string
    Event:
      type: object
      additionalProperties: false
      required:
      - id
      - org_id
      - silicon_id
      - hook_id
      - provider
      - delivery_sequence
      - received_at
      - summary
      - request
      properties:
        id:
          type: string
          format: uuid
        org_id:
          "$ref": "#/components/schemas/OrganizationId"
        silicon_id:
          "$ref": "#/components/schemas/SiliconId"
        hook_id:
          type: string
          format: uuid
        provider:
          type: string
          description: Hook name at receipt.
        delivery_sequence:
          type: integer
          format: int64
          minimum: 1
        received_at:
          type: string
          format: date-time
        summary:
          type: string
          description: Provider and receipt time in the hook's IANA timezone, formatted as `{provider} triggered at HH:MM:SS DD-MM-YYYY IANA_ZONE_ID`.
          example: stripe triggered at 10:00:00 22-09-2026 UTC
        request:
          "$ref": "#/components/schemas/CapturedRequest"
    EventPage:
      type: object
      additionalProperties: false
      description: The item limit is a ceiling; a 16 MiB page budget may produce a
        shorter page with a continuation cursor.
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 10000
          items:
            "$ref": "#/components/schemas/Event"
        next_cursor:
          type:
          - string
          - 'null'
    BlockedRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - org_id
      - silicon_id
      - hook_id
      - provider
      - reason_code
      - reason_detail
      - received_at
      - request
      properties:
        id:
          type: string
          format: uuid
        org_id:
          "$ref": "#/components/schemas/OrganizationId"
        silicon_id:
          "$ref": "#/components/schemas/SiliconId"
        hook_id:
          type: string
          format: uuid
        provider:
          type: string
        reason_code:
          type: string
          enum:
          - payload_unavailable
          - signature_unavailable
          - signature_missing
          - signature_not_text
          - signature_too_large
          - signature_mismatch
          - secret_missing
          - public_key_missing
          - material_unavailable
        reason_detail:
          type: string
          maxLength: 500
        received_at:
          type: string
          format: date-time
        request:
          "$ref": "#/components/schemas/CapturedRequest"
    BlockedRequestPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 10000
          items:
            "$ref": "#/components/schemas/BlockedRequest"
        next_cursor:
          type:
          - string
          - 'null'
    DeliveryCursor:
      type: object
      additionalProperties: false
      required:
      - silicon_id
      - acknowledged_through
      - acknowledged_at
      properties:
        silicon_id:
          "$ref": "#/components/schemas/SiliconId"
        acknowledged_through:
          type: integer
          format: int64
          minimum: 0
        acknowledged_at:
          type:
          - string
          - 'null'
          format: date-time
    DeliveryBatch:
      type: object
      additionalProperties: false
      required:
      - items
      - cursor
      - latest_sequence
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            "$ref": "#/components/schemas/Event"
        cursor:
          "$ref": "#/components/schemas/DeliveryCursor"
        latest_sequence:
          type: integer
          format: int64
          minimum: 0
    Acknowledge:
      type: object
      additionalProperties: false
      required:
      - through_sequence
      properties:
        through_sequence:
          type: integer
          format: int64
          minimum: 0
    Receipt:
      type: object
      additionalProperties: false
      required:
      - status
      - receipt_id
      properties:
        status:
          const: webhook.ok
        receipt_id:
          type: string
          format: uuid
    ApiVersionNegotiation:
      type: object
      required:
      - service
      - selected_api_version
      - supported_api_versions
      - build
      - commit
      properties:
        service:
          type: string
          const: silicon-hook
        selected_api_version:
          type: string
          pattern: "^v[1-9][0-9]*$"
        supported_api_versions:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            pattern: "^v[1-9][0-9]*$"
          description: Highest first.
        build:
          type: string
        commit:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - slt
      properties:
        slt:
          type: string
          minLength: 1
          maxLength: 4096
          description: Opaque, single-use application short-lived token issued by
            IAM.
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    Tokens:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - scopes
      - actor
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Rotates on every use.
        token_type:
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        scopes:
          type: array
          items:
            type: string
        actor:
          "$ref": "#/components/schemas/ActorRef"
        org_id:
          oneOf:
          - "$ref": "#/components/schemas/OrganizationId"
          - type: 'null'
    IamHook:
      type: object
      allOf:
      - "$ref": "#/components/schemas/HookBase"
      required:
      - iam_webhook
      properties:
        iam_webhook:
          type: object
          required:
          - secret_version
          properties:
            secret_version:
              type: integer
              minimum: 1
              description: Version IAM presents in X-Silicon-IAM-Key-Version.
      unevaluatedProperties: false
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: string
    TestEnvironment:
      type: object
      required:
      - id
      - org_id
      - creator_kind
      - creator_id
      - name
      - generation
      - created_at
      - last_activity_at
      - deleted_at
      properties:
        id:
          type: string
          format: uuid
        org_id:
          "$ref": "#/components/schemas/OrganizationId"
        creator_kind:
          type: string
          enum:
          - carbon
          - silicon
        creator_id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        generation:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
    EnvironmentWithKey:
      allOf:
      - "$ref": "#/components/schemas/TestEnvironment"
      - type: object
        required:
        - key
        - max_hooks
        properties:
          key:
            type: string
            pattern: "^[A-Za-z0-9]{32}$"
          max_hooks:
            type: integer
            const: 10
    TestIamConfiguration:
      type: object
      additionalProperties: false
      required:
      - app_id
      - app_secret
      - webhook_secret
      properties:
        app_id:
          type: string
          description: Canonical test application ID, e.g. hook.
        app_secret:
          type: string
          writeOnly: true
        webhook_secret:
          type: string
          writeOnly: true
        webhook_secret_version:
          type: integer
          minimum: 1
          default: 1
    CreateEnvironment:
      type: object
      additionalProperties: false
      required:
      - name
      - iam_test_key
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
        iam_test_key:
          type: string
          writeOnly: true
        iam:
          "$ref": "#/components/schemas/TestIamConfiguration"
    EnvironmentList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/TestEnvironment"

    ReceiverEnvironment:
      type: object
      additionalProperties: false
      required: [kind, id, generation]
      properties:
        kind:
          type: string
          const: testing
        id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
          description: Shared Honeycomb lifecycle generation; not Hook's internal credential generation.
    ReceiverScope:
      type: object
      additionalProperties: false
      required: [app_id, for, kind, org_id, hook_org_id, environment]
      properties:
        app_id:
          type: string
        for:
          $ref: '#/components/schemas/ExternalId'
        kind:
          type: string
          enum: [carbon, silicon]
        org_id:
          type: string
          format: uuid
          description: Authoritative IAM organization UUID used by the scoped Ting receiver.
        hook_org_id:
          $ref: '#/components/schemas/OrganizationId'
        environment:
          $ref: '#/components/schemas/ReceiverEnvironment'
    ReceiverBootstrap:
      type: object
      additionalProperties: false
      required: [environment_id, generation]
      properties:
        environment_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
          minimum: 1
        receiver_id:
          type: string
          minLength: 1
          maxLength: 255
          description: The existing scoped receiver to renew explicitly under a new operation key.
    ReceiverCapability:
      type: object
      additionalProperties: false
      required: [app_id, for, kind, org_id, hook_org_id, environment, receiver_id, receiver_token, expires_at]
      properties:
        app_id:
          type: string
        for:
          $ref: '#/components/schemas/ExternalId'
        kind:
          type: string
          enum: [carbon, silicon]
        org_id:
          type: string
          format: uuid
          description: Authoritative IAM organization UUID used by the scoped Ting receiver.
        hook_org_id:
          $ref: '#/components/schemas/OrganizationId'
        environment:
          $ref: '#/components/schemas/ReceiverEnvironment'
        receiver_id:
          type: string
        receiver_token:
          type: string
          pattern: '^ting_recv_[a-fA-F0-9]{64}$'
          description: Short-lived scoped secret for the enclosing app adapter; never log or place in URLs.
        expires_at:
          type: string
          format: date-time
          description: Original expiry is retained on exact replay, even after expiry.
    PublisherProvision:
      type: "object"
      additionalProperties: false
      required:
        - "slt"
      properties:
        slt:
          type: "string"
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: "Fresh Hook application SLT for the dedicated publisher Silicon, authorized in the selected organization. Never an interactive access/refresh token."
        replace_rejected:
          type: "boolean"
          default: false
          description: "Explicit recovery of a rejected publisher; cannot replace a usable session."
    PublisherMetadata:
      type: "object"
      additionalProperties: false
      required:
        - "org_id"
        - "actor_id"
        - "expires_at"
      properties:
        org_id:
          "$ref": "#/components/schemas/OrganizationId"
        actor_id:
          "$ref": "#/components/schemas/ExternalId"
        expires_at:
          type: "string"
          format: "date-time"
      description: "Non-secret dedicated publisher identity and conservative access-token expiry."
    TingRecipientGrant:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "app_id"
        - "for"
        - "active"
        - "required_delivery"
      properties:
        id:
          type: "string"
        app_id:
          type: "string"
        for:
          "$ref": "#/components/schemas/ExternalId"
        active:
          type: "boolean"
          const: true
        required_delivery:
          type: boolean
          description: Whether the recipient explicitly enabled required delivery for this app.
      description: "Verified active Ting grant for the authenticated actor and configured Hook app."
    ReceivingSubscription:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "org_id"
        - "silicon_id"
        - "recipient_id"
        - "created_at"
      properties:
        id:
          type: "string"
          format: "uuid"
        org_id:
          "$ref": "#/components/schemas/OrganizationId"
        silicon_id:
          "$ref": "#/components/schemas/SiliconId"
        recipient_id:
          "$ref": "#/components/schemas/ExternalId"
        created_at:
          type: "string"
          format: "date-time"
    ReceivingSubscriptionStatus:
      type: "object"
      additionalProperties: false
      required:
        - "receiving"
        - "subscription"
      properties:
        receiving:
          type: "boolean"
        subscription:
          oneOf:
            -
              "$ref": "#/components/schemas/ReceivingSubscription"
            -
              type: "null"
    TingDestinationReceipt:
      type: "object"
      additionalProperties: false
      required:
        - "webhook_id"
        - "delivery_acked"
        - "read_acked"
      properties:
        webhook_id:
          type: "string"
        delivery_acked:
          type: "boolean"
          description: "Ting daemon durably received the notification."
        read_acked:
          type: "boolean"
          description: "The local destination accepted the notification; does not mean completed recipient work."
    TingReceipt:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "read"
        - "silent"
        - "delivery"
        - "deliveries"
        - "more_destinations"
      properties:
        id:
          type: "string"
        read:
          type: "boolean"
          description: "At least one destination accepted the event, or a Carbon viewed it. This is not a completion receipt."
        silent:
          type: "boolean"
          description: "Recipient notification preference; required delivery still routes silently."
        delivery:
          type: string
          enum: [ordinary, required]
        deliveries:
          type: "array"
          items:
            "$ref": "#/components/schemas/TingDestinationReceipt"
        more_destinations:
          type: "boolean"
          description: "Only the first destination page is returned; true means this list is incomplete."
    PublicationStatus:
      type: "object"
      additionalProperties: false
      required:
        - "event_id"
        - "recipient_id"
        - "state"
        - "delivery"
        - "silent"
        - "attempts"
        - "ting_id"
        - "last_error_code"
        - "accepted_at"
        - "next_attempt_at"
        - "expires_at"
        - "recipient_receipt"
        - "recipient_status_error"
      properties:
        event_id:
          type: "string"
          format: "uuid"
        recipient_id:
          "$ref": "#/components/schemas/ExternalId"
        state:
          type: "string"
          enum:
            - "pending"
            - "accepted_by_ting"
            - "accepted_silently"
          description: "A verified Ting acceptance is separate from any destination receipt."
        delivery:
          type: string
          enum: [ordinary, required]
        silent:
          type: [boolean, "null"]
          description: Ting notification preference at acceptance; null until accepted. Required delivery remains accepted_by_ting even if silent.
        attempts:
          type: "integer"
          format: "int64"
          minimum: 0
        ting_id:
          type:
            - "string"
            - "null"
        last_error_code:
          type:
            - "string"
            - "null"
          description: "Safe bounded publication diagnostic; never upstream response bodies or credentials."
          enum:
            - null
            - "authorization_unavailable"
            - "consent_required"
            - "recipient_not_registered"
            - "required_delivery_not_enabled"
            - "transport_unavailable"
            - "rate_limited"
            - "ting_unavailable"
            - "request_rejected"
            - "invalid_response"
            - "publisher_not_configured"
            - "publisher_unavailable"
            - "publisher_unauthorized"
            - "ting_unauthorized"
            - "type_not_registered"
            - "idempotency_conflict"
            - "environment_changed"
        accepted_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        next_attempt_at:
          type: "string"
          format: "date-time"
        expires_at:
          type: "string"
          format: "date-time"
        recipient_receipt:
          oneOf:
            -
              "$ref": "#/components/schemas/TingReceipt"
            -
              type: "null"
        recipient_status_error:
          type:
            - "string"
            - "null"
          enum:
            - null
            - "publisher_unavailable"
            - "recipient_status_unavailable"
          description: "Live receipt lookup failure; does not invalidate known publication status."

    EventReference:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "org_id"
        - "silicon_id"
        - "hook_id"
        - "delivery_sequence"
        - "received_at"
        - "summary"
        - "environment_id"
        - "environment_generation"
      properties:
        id:
          type: "string"
          format: "uuid"
        org_id:
          "$ref": "#/components/schemas/OrganizationId"
        silicon_id:
          "$ref": "#/components/schemas/SiliconId"
        hook_id:
          type: "string"
          format: "uuid"
        delivery_sequence:
          type: "integer"
          format: "int64"
          minimum: 1
        received_at:
          type: "string"
          format: "date-time"
        summary:
          type: "string"
          description: "Provider and receipt time in the hook's IANA timezone: {provider} triggered at HH:MM:SS DD-MM-YYYY IANA_ZONE_ID."
          example: "stripe triggered at 10:00:00 22-09-2026 UTC"
        environment_id:
          type: "string"
          format: "uuid"
          description: "Original event environment; nil UUID in production."
        environment_generation:
          type: "integer"
          format: "int64"
          minimum: 0
          description: "Original event generation; zero in production. Preserved across rotation and restore. Hydration rejects a reference after its canonical event is cleaned or expires."
      description: "Immutable reference delivered inside Ting. Contains no captured provider body, headers or signing secret. Hydration requires current Hook authorization."
    TingHookEvent:
      type: "object"
      additionalProperties: false
      required:
        - "type"
        - "data"
      properties:
        type:
          type: "string"
          const: "new_event"
        data:
          type: "object"
          additionalProperties: false
          required:
            - "sender"
            - "metadata"
          properties:
            sender:
              type: "string"
              description: "Provider hook name at receipt."
            metadata:
              "$ref": "#/components/schemas/EventReference"
    ContractStatus:
      type: "object"
      additionalProperties: false
      required:
        - "api_version"
        - "status"
        - "deprecated_at"
        - "sunset_at"
        - "websocket_protocols"
        - "relay_protocols"
        - "delivery_transport"
      properties:
        api_version:
          type: "string"
          enum:
            - "v2"
            - "v1"
        status:
          type: "string"
          enum:
            - "active"
            - "deprecated"
            - "sunset"
        deprecated_at:
          type:
            - "integer"
            - "null"
          format: "int64"
          description: "Unix timestamp in seconds."
        sunset_at:
          type:
            - "integer"
            - "null"
          format: "int64"
          description: "Unix timestamp in seconds."
        websocket_protocols:
          type: "array"
          maxItems: 1
          items:
            type: "integer"
            const: 1
          description: "Empty for v2; [1] for legacy v1."
        relay_protocols:
          type: "array"
          maxItems: 1
          items:
            type: "integer"
            const: 1
          description: "Empty for v2; [1] for legacy v1."
        delivery_transport:
          type: "string"
          enum:
            - "ting"
            - "hook"
          description: "ting for v2; hook for legacy v1."
    ContractCatalog:
      type: "object"
      additionalProperties: false
      required:
        - "service"
        - "contracts"
        - "policy"
        - "compatibility_matrix"
      properties:
        service:
          type: "string"
          const: "silicon-hook"
        contracts:
          type: "array"
          maxItems: 2
          items:
            "$ref": "#/components/schemas/ContractStatus"
        policy:
          type: "object"
          additionalProperties: false
          required:
            - "breaking_changes"
            - "sunset_after_idle_days"
            - "sunset_requires_deprecation"
          properties:
            breaking_changes:
              type: "string"
              const: "new_major"
            sunset_after_idle_days:
              type: "integer"
              const: 7
            sunset_requires_deprecation:
              type: "boolean"
              const: true
        compatibility_matrix:
          type: "string"
          format: "uri"
