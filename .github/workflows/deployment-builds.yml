name: Build deployment artifacts

# Builds the native Linux ARM64 backend archive (hook-api, hook-worker,
# hook-migrate, hook-contract, systemd units, runtime grants, installer and a
# SHA-256 manifest) that deploy/native/install.py installs. The web console is a
# Next.js app deployed on Vercel, so no gateway image is built here.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing source commit or release tag
        required: true
        default: main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install ziglang==0.15.2
          echo "$RUNNER_TEMP/zig/lib/python3.12/site-packages/ziglang" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --locked --version 0.23.4
      - run: cargo zigbuild --locked --release -p silicon-hook --bins --target aarch64-unknown-linux-gnu.2.28
      - run: python3 scripts/package-backend.py --artifacts target/aarch64-unknown-linux-gnu/release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: hook-deployment-backend
          path: artifacts/
          if-no-files-found: error
