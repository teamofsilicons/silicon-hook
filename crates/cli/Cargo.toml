[package]
name = "silicon-hook-cli"
version = "0.9.1"
edition = "2024"
rust-version = "1.98"
description = "Silicon Hook management CLI and internal delivery inspection"
license = "Apache-2.0"
readme = "../../docs/cli/README.md"
repository = "https://github.com/teamofsilicons/silicon-hook"

[[bin]]
name = "hook"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
silicon-hook-client = { path = "../client", version = "0.9.1" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.7"
uuid = { version = "1.26.0", features = ["serde", "v7", "v4"] }
zeroize = "1.8.2"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["process", "net"] }

[lints.rust]
unsafe_code = "forbid"
