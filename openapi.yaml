        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Ting]
      operationId: bootstrapReceiverV2
      summary: Acquire or explicitly renew a scoped internal testing receiver
      description: Requires Ting 0.1.4. The environment and shared generation must match the previously selected scope. Hook obtains a fresh request-bound IAM proof for every attempt, using only its exact audience testing headers. Retry an uncertain request with the same Idempotency-Key and body. An exact replay returns the original capability and expiry, which can already be expired; it does not resume receiving or extend authority. Renew explicitly with a new key and the original receiver_id. This testing-only capability permits the current actor's Hook inbox and watch, not general sessions, grant changes, destinations or ACKs. It expires within 30 seconds and no later than its IAM proof. Production is rejected.
